[project]
name = "bazaar-contrib-market-example"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = ["bazaar-core~=0.3.0rc1", "pydantic>=2.12.0"]

[project.entry-points."bazaar_compute_node.contribs"]
market-example = "market_example:example"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "market_example"
