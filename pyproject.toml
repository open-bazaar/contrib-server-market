[project]
name = "bazaar-contrib-server-market"
version = "0.3.0rc2"
description = "The Bazaar Compute Contrib market, using each computer's own catalog and package manager"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.15"
dependencies = [
    "bazaar-core~=0.3.0rc1",
    "bazaar-contrib-config~=0.3.0rc31",
    "bazaar-contrib-status~=0.3.0rc32",
    "bazaar-contrib-manager~=0.3.0rc32",
    "bazaar-contrib-server~=0.3.0rc15",
    "bazaar-contrib-server-access~=0.3.0rc7",
    "bazaar-contrib-server-computer~=0.3.0rc2",
    "bazaar-contrib-sidecar~=0.3.0rc1",
    "pydantic>=2.12.0",
    "python-multipart>=0.0.32",
    "starlette>=0.48.0",
]

[project.entry-points."bazaar_compute_node.contribs"]
server-market = "bazaar_contrib_server_market:market"

[project.urls]
Repository = "https://github.com/open-bazaar/contrib-server-market"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bazaar-compute[node]~=0.3.0rc31",
    "bazaar-contrib-agent~=0.3.0rc1",
    "bazaar-contrib-audit~=0.3.0rc1",
    "bazaar-contrib-channel~=0.3.0rc1",
    "bazaar-contrib-collaboration~=0.3.0rc1",
    "bazaar-contrib-config-filesystem~=0.3.0rc1",
    "bazaar-contrib-harness~=0.3.0rc1",
    "bazaar-contrib-legacy-node-migrations~=0.3.0rc1",
    "bazaar-contrib-logging~=0.3.0rc1",
    "bazaar-contrib-messages~=0.3.0rc1",
    "bazaar-contrib-reminder~=0.3.0rc1",
    "bazaar-contrib-schema~=0.3.0rc1",
    "bazaar-contrib-sidecar-unix~=0.3.0rc1; sys_platform != 'win32'",
    "bazaar-contrib-sidecar-windows~=0.3.0rc1; sys_platform == 'win32'",
    "bazaar-contrib-storage~=0.3.0rc1",
    "bazaar-contrib-http~=0.3.0rc1",
    "bazaar-contrib-server-database~=0.3.0rc1",
    "bazaar-contrib-server-agent~=0.3.0rc12",
    "bazaar-contrib-sqlite~=0.3.0rc1",
    "bazaar-contrib-starlink~=0.3.0rc1",
    "bazaar-contrib-timer~=0.3.0rc31",
    "blockbuster>=1.5.29,<1.6",
    "httpx>=0.28.0,<1",
    "playwright==1.64.1",
    "pyright==1.1.414",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
    "tomli-w>=1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:anyio"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "e2e: requires a real external provider",
    "system: runs real native system services in an isolated environment",
]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.15"
pythonPlatform = "All"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
reportMatchNotExhaustive = "error"
reportUnreachable = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"

[tool.ruff.lint]
extend-select = ["ASYNC"]

[tool.uv.sources]
bazaar-contrib-manager = { git = "https://github.com/yuchanns/bazaar-compute-node.git", rev = "8ff989dcf3eb8f095629b2662a0bdeb4d5fbe55e", subdirectory = "contrib/manager" }
bazaar-contrib-status = { git = "https://github.com/yuchanns/bazaar-compute-node.git", rev = "8ff989dcf3eb8f095629b2662a0bdeb4d5fbe55e", subdirectory = "contrib/status" }
